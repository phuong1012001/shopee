version: '3.4'

services:
  Shopee.API:
    container_name: Shopee.API
    image: ${DOCKER_REGISTRY-}shopeeapi
    build:
      context: .
      dockerfile: Shopee.API/Dockerfile
    depends_on:
      - Shopee.Db
    # environment:
    #   - ConnectionStrings__Default=server=Shopee.Db;port=3306;database=shopee;user id=root;password=Password@1234

  Shopee.Db:
    container_name: Shopee.Db
    image:  mariadb:10.11.6
    environment:
      - MARIADB_ROOT_PASSWORD=Password@1234
    ports:
      - "3306:3306"
    volumes:
      - "./data:/var/lib/mysql"
      # - db_data:/var/lib/mysql

# volumes:
#   db_data:
